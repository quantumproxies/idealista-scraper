[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quanticdata-idealista-scraper"
version = "0.1.0"
description = "Idealista scraper for Python and the command line: homes for sale or rent in Spain, Italy and Portugal with price, price per m2, rooms, size, floor, price drops and listing agency, as JSON or CSV. Free and open source; sign in with your QuanticData account, no proxies or headless browser to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "QuanticData", email = "hello@quanticdata.io" }]
keywords = ["idealista-scraper", "idealista", "idealista-api", "idealista-data", "real-estate", "real-estate-data", "property-data", "housing-data", "spain", "italy", "portugal", "web-scraping"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=1.3"]

[project.scripts]
idealista-scraper = "quanticdata_idealista_scraper.__main__:run"

[project.urls]
Homepage = "https://quanticdata.io/collectors/idealista-scraper-api/?utm_source=github&utm_medium=pypi&utm_campaign=idealista-scraper"
Documentation = "https://quanticdata.io/docs/"
Source = "https://github.com/quantumproxies/idealista-scraper"
Issues = "https://github.com/quantumproxies/idealista-scraper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quanticdata_idealista_scraper" = ["spec.json", "py.typed"]
